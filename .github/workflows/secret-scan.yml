name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (new commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # PR: origin/main..HEAD covers the PR commits.
      # Push to main: no new commits → no-op (existing history leaks are handled separately).
      - name: Scan new commits
        run: gitleaks git --no-banner --redact --log-opts="origin/main..HEAD"
